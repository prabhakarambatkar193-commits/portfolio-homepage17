<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="gallery-header">
        <h1>Optimized Responsive Gallery</h1>
        <p>Built with performance and layout stability in mind.</p>
    </header>

    <main>
        <section class="gallery-grid" id="imageGallery">
            <!-- Gallery items with native lazy loading -->
            <div class="gallery-item">
                <img src="https://picsum.photos/id/1015/600/400" alt="River and mountains" loading="lazy" width="600" height="400">
            </div>
            <div class="gallery-item">
                <img src="https://picsum.photos/id/1016/600/400" alt="Path through a forest" loading="lazy" width="600" height="400">
            </div>
            <div class="gallery-item">
                <img src="https://picsum.photos/id/1019/600/400" alt="Coastal view" loading="lazy" width="600" height="400">
            </div>
            <div class="gallery-item">
                <img src="https://picsum.photos/id/1020/600/400" alt="Bear in nature" loading="lazy" width="600" height="400">
            </div>
            <div class="gallery-item">
                <img src="https://picsum.photos/id/1024/600/400" alt="Vulture perched" loading="lazy" width="600" height="400">
            </div>
            <div class="gallery-item">
                <img src="https://picsum.photos/id/1025/600/400" alt="Pug dog portrait" loading="lazy" width="600" height="400">
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
